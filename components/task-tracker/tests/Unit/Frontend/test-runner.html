<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frontend Unit Test Suite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
        h1 { margin-bottom: 16px; font-size: 1.5rem; }
        .summary { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; font-size: 1.1rem; }
        .passed-banner { border-left: 4px solid #10b981; color: #34d399; }
        .failed-banner { border-left: 4px solid #ef4444; color: #f87171; }
        .test-case { background: #1e293b; padding: 12px 16px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .test-case.pass { border-left: 4px solid #10b981; }
        .test-case.fail { border-left: 4px solid #ef4444; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .badge.pass { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge.fail { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .error-details { font-family: monospace; font-size: 0.85rem; color: #fca5a5; margin-top: 6px; }
    </style>
</head>
<body>
    <h1>Task Tracker Frontend Unit Test Runner</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div id="test-results"></div>

    <script type="module">
        import { runRegexTests } from './regex.test.js';
        import { runValidatorTests } from './validator.test.js';

        let total = 0;
        let passed = 0;
        let failed = 0;
        const resultsContainer = document.getElementById('test-results');

        const assert = {
            test: (description, testFn) => {
                total++;
                try {
                    testFn();
                    passed++;
                    renderTestResult(description, true);
                } catch (err) {
                    failed++;
                    renderTestResult(description, false, err.message);
                }
            },
            equal: (actual, expected, msg) => {
                if (actual !== expected) {
                    throw new Error(msg || `Expected '${expected}', but got '${actual}'`);
                }
            },
            isTrue: (val, msg) => {
                if (val !== true) throw new Error(msg || `Expected true, but got ${val}`);
            },
            isFalse: (val, msg) => {
                if (val !== false) throw new Error(msg || `Expected false, but got ${val}`);
            },
            null: (val, msg) => {
                if (val !== null) throw new Error(msg || `Expected null, but got ${val}`);
            },
            notNull: (val, msg) => {
                if (val === null || val === undefined) throw new Error(msg || `Expected non-null value`);
            }
        };

        function renderTestResult(description, isPass, errorMsg = '') {
            const div = document.createElement('div');
            div.className = `test-case ${isPass ? 'pass' : 'fail'}`;
            div.innerHTML = `
                <div>
                    <div>${description}</div>
                    ${errorMsg ? `<div class="error-details">${errorMsg}</div>` : ''}
                </div>
                <span class="badge ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASSED' : 'FAILED'}</span>
            `;
            resultsContainer.appendChild(div);
        }

        // Execute Test Suites
        runRegexTests(assert);
        runValidatorTests(assert);

        const summaryEl = document.getElementById('summary');
        if (failed === 0) {
            summaryEl.className = 'summary passed-banner';
            summaryEl.textContent = `✓ All ${passed} tests passed successfully (100% Pass Rate).`;
        } else {
            summaryEl.className = 'summary failed-banner';
            summaryEl.textContent = `✖ Test Run Failed: ${failed} failed, ${passed} passed out of ${total} total tests.`;
        }
    </script>
</body>
</html>
